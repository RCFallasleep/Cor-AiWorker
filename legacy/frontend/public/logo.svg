<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!--
    递归三层结构（t=0.25，同一角度向内嵌套）：
    层1（外）: A(32,4) B(4,58) C(60,58)
    层2（中）: A(27.69,20.62) B(19.08,53.85) C(49.23,45.54)  ← 层1射线交点
    层3（内）: A(27.36,30.20) B(26.70,49.37) C(41.94,40.43)  ← 层2射线交点
    三层共同重心: (32, 40)
  -->

  <!-- ── 层1：外层等边三角形 ── -->
  <polygon
    points="32,4 4,58 60,58"
    stroke="#3b82f6"
    stroke-width="2"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- ── 层1射线：从层1顶点射出，止于层2顶点 ── -->
  <line x1="32"    y1="4"     x2="27.69" y2="20.62" stroke="#3b82f6" stroke-width="1.2" opacity="0.55"/>
  <line x1="32"    y1="4"     x2="19.08" y2="53.85" stroke="#3b82f6" stroke-width="1.2" opacity="0.55"/>
  <line x1="4"     y1="58"    x2="19.08" y2="53.85" stroke="#3b82f6" stroke-width="1.2" opacity="0.55"/>
  <line x1="4"     y1="58"    x2="49.23" y2="45.54" stroke="#3b82f6" stroke-width="1.2" opacity="0.55"/>
  <line x1="60"    y1="58"    x2="49.23" y2="45.54" stroke="#3b82f6" stroke-width="1.2" opacity="0.55"/>
  <line x1="60"    y1="58"    x2="27.69" y2="20.62" stroke="#3b82f6" stroke-width="1.2" opacity="0.55"/>

  <!-- ── 层2：中层三角形（层1射线交点） ── -->
  <polygon
    points="27.69,20.62 19.08,53.85 49.23,45.54"
    stroke="#3b82f6"
    stroke-width="1.6"
    stroke-linejoin="round"
    fill="none"
    opacity="0.9"
  />

  <!-- ── 层2射线：从层2顶点射出，止于层3顶点 ── -->
  <line x1="27.69" y1="20.62" x2="27.36" y2="30.20" stroke="#3b82f6" stroke-width="1.0" opacity="0.5"/>
  <line x1="27.69" y1="20.62" x2="26.70" y2="49.37" stroke="#3b82f6" stroke-width="1.0" opacity="0.5"/>
  <line x1="19.08" y1="53.85" x2="26.70" y2="49.37" stroke="#3b82f6" stroke-width="1.0" opacity="0.5"/>
  <line x1="19.08" y1="53.85" x2="41.94" y2="40.43" stroke="#3b82f6" stroke-width="1.0" opacity="0.5"/>
  <line x1="49.23" y1="45.54" x2="41.94" y2="40.43" stroke="#3b82f6" stroke-width="1.0" opacity="0.5"/>
  <line x1="49.23" y1="45.54" x2="27.36" y2="30.20" stroke="#3b82f6" stroke-width="1.0" opacity="0.5"/>

  <!-- ── 层3：最内层三角形（层2射线交点） ── -->
  <polygon
    points="27.36,30.20 26.70,49.37 41.94,40.43"
    stroke="#3b82f6"
    stroke-width="1.3"
    stroke-linejoin="round"
    fill="#3b82f6"
    fill-opacity="0.18"
    opacity="0.85"
  />

  <!-- ── 中心点（三层共同重心 32,40） ── -->
  <circle cx="32" cy="40" r="2"   fill="#3b82f6"/>
  <circle cx="32" cy="40" r="4.5" fill="#3b82f6" opacity="0.15"/>

</svg>
