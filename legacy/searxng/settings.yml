# SearXNG 配置文件
# 关键：开启 json 格式输出，供后端 API 调用

use_default_settings: true

general:
  debug: false
  instance_name: "Cor-AiWorker Search"

search:
  # 开启 json / csv / rss 格式，默认只有 html
  formats:
    - html
    - json

server:
  secret_key: "cor-aiworker-searxng-secret-change-in-prod"
  bind_address: "0.0.0.0"
  port: 8080
  # 允许来自后端容器的请求（关闭 limiter 避免本地调用被限速）
  limiter: false
  image_proxy: false

ui:
  default_theme: simple
