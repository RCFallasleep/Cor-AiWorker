[project]
name = "cor-aiworker"
version = "0.0.1"
description = "本地优先的个人 Agent Harness，支持跨实例上下文协作"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "jsonschema>=4.26.0",
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "openai>=3.31.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.11",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cor_aiworker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F 基础错误, I 导入排序, B 常见 bug, UP 新语法, SIM 简化,
# ASYNC 异步阻塞调用, S 安全规则（bandit，对应 PRD 安全基线）
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # 测试中允许 assert

[tool.mypy]
strict = true
files = ["src", "spikes", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
